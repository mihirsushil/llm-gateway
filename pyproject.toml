[project]
name = "llm-gateway"
version = "0.2.0"
description = "An OpenAI-compatible LLM gateway with rate limiting, caching, retries, cost-aware routing, budget enforcement, and streaming guardrails."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
